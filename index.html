<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Aquatech Ghana is an online shop offering quality products at competitive prices with fast, reliable delivery.">
    <title>Aquatech – Online Shopping in Ghana</title>.
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <header>
        <h1>AquaTech</h1>
        <p id="motto">Shop Smart•Live Better</p>
    </header>
    <nav>
        <ul>
            <li><a href="#" id="active">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="custcare.html">Customer Care</a></li>
        </ul>
    </nav>
    <h2>Product List</h2>
    <table>
        <tr id="head">
           <th>Product</th> 
           <th class="quan">Quantity</th>
           <th>Price</th>
           <th>Total</th>
        </tr>
        <tr>
            <td><img src="sneakers.jpg" alt="Sneakers"><br><br><strong>Sneakers</strong></td>
            <td class="quan"><input type="Number"id="input1"><button type="button" onclick="pro1()">Add To Cart</button></td>
            <td>GH¢200</td>
            <td id="total1">GH¢0</td>
        </tr>
        <tr>
            <td><img src="smartwatch.jpg" alt="Smart Watch"><br><br><strong>Smart Watch</strong></td>
            <td class="quan"><input type="Number" id="input2"><button type="button" onclick="pro2()">Add To Cart</button></td>
            <td>GH¢150</td>
            <td id="total2">GH¢0</td>
        </tr>
        <tr>
            <td><img src="bluetoothspeaker.jpg" alt="Bluetooth Speaker"><br><br><strong>Bluetooth Speaker</strong></td>
            <td class="quan"><input type="Number" id="input3"><button onclick="pro3()">Add To Cart</button></td>
            <td>GH¢90</td>
            <td id="total3">GH¢0</td>
        </tr>
    </table>
   <div id="butc"><button type="button" id="button" onclick="checkout()">Check Out</button></div> 
   
   <p id="check"></p>
    <footer>
        ©Aquah Group Of Companies 
    </footer>
    
    <script>
     function   pro1() {
            let quantity = Number(document.getElementById("input1").value);
            let price = 200;
            document.getElementById("total1").innerHTML = "GH¢" + quantity * price;
            
        }
        
     function pro2() {
            let quantity=Number(document.getElementById("input2").value);
            let price= 150;
            document.getElementById("total2"). innerHTML= "GH¢" + quantity* price;
        }
        
        
     function pro3() {
            let quantity=Number(document.getElementById("input3").value);
            let price= 90;
            document.getElementById("total3"). innerHTML= "GH¢" + quantity* price;
        }
        
        function checkout() {
            let item1 = Number(document.getElementById("input1").value);
            let item2 = Number(document.getElementById("input2").value);
            let item3= Number(document.getElementById("input3").value);
            document.getElementById("check").innerHTML = "The Total Cost is GH¢" +( (item1*200) + (item2*150) + (item3*90)) + " Please Proceed to Payment";
        }
      
        
        
        
    </script>
</body>
</html>
